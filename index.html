<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P單久置未取平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#1d2733;--ink2:#5a6776;--ink3:#8b96a3;--line:#dfe4ea;
  --brand:#1f4e79;--brand2:#2e75b6;--brandbg:#e8f0f8;
  --ok:#1e7e4a;--okbg:#e5f4ec;--warn:#a86400;--warnbg:#fff3dd;--bad:#c0392b;--badbg:#fdecea;--wait:#6b4fa0;--waitbg:#f0ebf8;
  --r:10px;--sh:0 1px 3px rgba(20,40,60,.08),0 4px 14px rgba(20,40,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
.hidden{display:none!important}
/* 頂部 */
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
.hbar{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:.5px;white-space:nowrap}
.logo small{font-weight:400;opacity:.75;font-size:12px;margin-left:6px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;color:#cfe0f0;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500}
nav button:hover{background:rgba(255,255,255,.1);color:#fff}
nav button.on{background:#fff;color:var(--brand)}
nav .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:18px;text-align:center}
.who{font-size:13px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.who .unit{background:rgba(255,255,255,.18);padding:2px 8px;border-radius:12px}
.who button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:20px;margin:4px 0 14px}
h3{font-size:16px;margin:0 0 10px}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;border-left:5px solid var(--brand2);cursor:pointer}
.kpi b{display:block;font-size:30px;line-height:1.15}
.kpi span{color:var(--ink2);font-size:13px}
.kpi.bad{border-color:var(--bad)}.kpi.bad b{color:var(--bad)}
.kpi.warn{border-color:#e69500}.kpi.warn b{color:var(--warn)}
.kpi.wait{border-color:var(--wait)}.kpi.wait b{color:var(--wait)}
.kpi.ok{border-color:var(--ok)}.kpi.ok b{color:var(--ok)}
/* 卡片清單 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--brand2)}
.card .no{font-weight:700;font-size:16px}
.card .meta{color:var(--ink2);font-size:13px}
.card .stp{margin-top:6px;font-weight:500}
.card.overdue{border-left:5px solid var(--bad)}
.card.today{border-left:5px solid #e69500}
.chip{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.c-run{background:var(--brandbg);color:var(--brand)}.c-done{background:var(--okbg);color:var(--ok)}.c-stop{background:#eceff2;color:#59636e}
.c-bad{background:var(--badbg);color:var(--bad)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-wait{background:var(--waitbg);color:var(--wait)}
.sec-title{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-weight:700}
.sec-title .chip{font-size:13px}
.empty{color:var(--ink3);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
/* 表格 */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input,.tools select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
.tools input[type=search]{min-width:220px;flex:1}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:#eef2f6;color:var(--ink2);font-weight:500;text-align:left;padding:8px 10px;white-space:nowrap;position:sticky;top:0}
table.t td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f6f9fc}
/* 按鈕與表單 */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.pri:hover{background:var(--brand)}
.btn.danger{color:var(--bad);border-color:#f0c4be}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.form-row label{font-size:13px;color:var(--ink2);font-weight:500}
.form-row input,.form-row select,.form-row textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%}
.form-row textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.req{color:var(--bad)}
/* 抽屜 */
.overlay{position:fixed;inset:0;background:rgba(15,30,45,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(860px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.dhead{background:var(--panel);padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.dhead .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dhead .big{font-size:22px;font-weight:700}
.dhead .x{margin-left:auto;font-size:26px;background:none;border:0;cursor:pointer;color:var(--ink2);line-height:1}
.dhead .info{color:var(--ink2);font-size:13px;margin-top:4px}
.dbody{padding:16px 20px}
.stepper{display:flex;gap:3px;margin-top:12px}
.stepper div{flex:1;height:8px;border-radius:4px;background:#dde3ea}
.stepper .grp{flex:3;display:flex;gap:2px;height:auto;padding:2px;margin:-3px 0;background:none;border:1px solid var(--brand2);border-radius:6px}
.stepper div.d{background:var(--ok)}.stepper div.c{background:var(--brand2)}.stepper div.w{background:var(--wait)}.stepper div.s{background:#9aa5b1}
/* 時間軸 */
.tl{position:relative;margin-left:14px}
.tl:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px 26px}
.tli .dot{position:absolute;left:-11px;top:2px;width:24px;height:24px;border-radius:50%;background:#dde3ea;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tli.d .dot{background:var(--ok)}.tli.c .dot{background:var(--brand2);box-shadow:0 0 0 4px var(--brandbg)}.tli.w .dot{background:var(--wait)}.tli.x .dot{background:#9aa5b1}
.tli .tt{font-weight:700}
.cgroup{position:relative;margin:0 0 16px 14px;border:1px solid var(--brand2);border-radius:10px;background:var(--brandbg);padding:10px 10px 0 18px}
.cgroup .tli{padding-bottom:12px}
.cg-hd{font-weight:700;color:var(--brand);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cg-hd .chip{font-weight:500}
.cg-plan{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px -8px;font-size:12px}
.cg-plan div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;line-height:1.35}
.cg-plan div b{display:block;font-size:15px;color:var(--ink)}
.cg-plan div.d{border-color:var(--ok)}.cg-plan div.d b{color:var(--ok)}.cg-plan div.c{border-color:var(--brand2);box-shadow:0 0 0 2px var(--brandbg)}
@media (max-width:520px){.cg-plan{grid-template-columns:repeat(2,1fr)}}
.tli .tt .chip{margin-left:6px;font-weight:500}
.tli .by{color:var(--ink2);font-size:13px}
.tli .vals{margin:6px 0 0;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:14px}
.tli .vals div{margin:1px 0}
.tli.f .dot{background:#dde3ea}.tli.f .tt{color:var(--ink3);font-weight:500}
.stepform{margin-top:8px;background:var(--panel);border:2px solid var(--brand2);border-radius:10px;padding:14px}
.target{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:#fafcfe}
.target .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.target .hd label{font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.target .hd input[type=datetime-local]{padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.sms{margin-top:8px;font-size:13px;background:#fff;border:1px dashed #b9c6d3;border-radius:6px;padding:8px;white-space:pre-wrap;color:#33414f}
.sms-bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--ink2)}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.att{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:13px;cursor:pointer}
.att:hover{border-color:var(--brand2)}
.notice{padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.notice.wait{background:var(--waitbg);color:var(--wait)}
.notice.info{background:var(--brandbg);color:var(--brand)}
.notice.bad{background:var(--badbg);color:var(--bad)}
.notice.ok{background:var(--okbg);color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
details.logs summary{cursor:pointer;font-weight:700;margin:6px 0}
/* 對話框 */
.modal-bg{position:fixed;inset:0;background:rgba(15,30,45,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{font-size:18px}
.modal .actions{justify-content:flex-end;margin-top:16px}
.modal img{max-width:100%;border-radius:8px}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#22313f;color:#fff;padding:10px 18px;border-radius:8px;box-shadow:var(--sh);font-size:14px;max-width:90vw}
#toast div.err{background:var(--bad)}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;background:linear-gradient(90deg,transparent,#7fb8e8,transparent);background-size:40% 100%;animation:bz 1s linear infinite}
@keyframes bz{from{background-position:-40% 0}to{background-position:140% 0}}
/* 登入 */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#1f4e79,#2e75b6)}
.login .box{background:#fff;border-radius:14px;padding:32px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.login h1{font-size:22px;margin:0 0 6px}
.login p{color:var(--ink2);margin:0 0 20px}
.login .msg{margin-top:16px}
/* 報表 */
.bars .bar{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bars .bar i{display:block;height:16px;border-radius:4px;background:var(--brand2);min-width:2px}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:18px;cursor:pointer}
.subtabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media (max-width:640px){
  .hbar{gap:8px}.logo small{display:none}
  nav button{padding:6px 8px;font-size:14px}
  .dhead,.dbody{padding-left:14px;padding-right:14px}
  .bars .bar{grid-template-columns:96px 1fr 36px}
  .tools input[type=search]{min-width:0}
}
</style>
</head>
<body>
<div id="busy" class="hidden"></div>
<div id="toast"></div>

<!-- 初次設定 -->
<section id="vSetup" class="login hidden">
  <div class="box" style="text-align:left">
    <h1>初次設定</h1>
    <p>請填入管理員給你的後端網址（只需設定一次）。</p>
    <div class="form-row"><label>後端網址（GAS 網頁應用程式 /exec 網址）</label><input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <button class="btn pri" id="cfgSave">儲存</button>
  </div>
</section>

<!-- 登入 -->
<section id="vLogin" class="login hidden">
  <div class="box">
    <h1>P單久置未取平台</h1>
    <form id="loginForm" autocomplete="on" style="text-align:left">
      <p style="text-align:center">請輸入管理員給你的帳號和密碼</p>
      <div class="form-row"><label>帳號（Email）</label><input id="lE" type="email" autocomplete="username" required></div>
      <div class="form-row"><label>密碼</label><input id="lP" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" id="lBtn" type="submit" style="width:100%;justify-content:center">登入</button>
      <p style="font-size:12px;color:var(--ink3);text-align:center;margin-top:12px">忘記密碼請洽管理員重設</p>
    </form>
    <form id="pwForm" class="hidden" autocomplete="off" style="text-align:left">
      <p style="text-align:center"><b>第一次登入，請設定自己的密碼</b></p>
      <div class="form-row"><label>目前密碼（管理員給的初始密碼）</label><input id="pO" type="password" autocomplete="current-password"></div>
      <div class="form-row"><label>新密碼（至少 8 個字，要有英文字母和數字）</label><input id="pN" type="password" autocomplete="new-password"></div>
      <div class="form-row"><label>再輸入一次新密碼</label><input id="pN2" type="password" autocomplete="new-password"></div>
      <button class="btn pri" id="pBtn" type="submit" style="width:100%;justify-content:center">儲存新密碼並進入</button>
    </form>
    <div class="msg" id="loginMsg"></div>
  </div>
</section>

<!-- 主畫面 -->
<section id="vApp" class="hidden">
  <header><div class="hbar">
    <div class="logo">P單久置未取平台<small>宅+裝 P單處理流程</small></div>
    <nav id="nav"></nav>
    <div class="who"><span id="whoName"></span><span class="unit" id="whoUnit"></span><button id="btnPw">改密碼</button><button id="btnLogout">登出</button></div>
  </div></header>
  <main id="main"></main>
</section>

<div id="drawerRoot"></div>
<div id="modalRoot"></div>

<script>
/* ===== 部署設定：管理員填好這兩個值再上傳，大家就不用自己設定 ===== */
var APP_CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzCQqniZ565CnEpiTsV8U1wBwNQmUnytO-g3oUWddHFVKf_Nf9tkLew-XIt8ty-oHC-Mg/exec'
};
</script>
<script>
(function () {
'use strict';
var LS_CFG = 'porder_cfg', LS_TOKEN = 'porder_token', LS_BOOT = 'porder_boot';
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

var cfg = (function () {
  var saved = {}; try { saved = JSON.parse(ls(LS_CFG) || '{}'); } catch (e) {}
  return { GAS_URL: APP_CONFIG.GAS_URL || saved.GAS_URL || '' };
})();
if (/[?&]reset/.test(location.search)) { ls(LS_CFG, null); ls(LS_TOKEN, null); }
(function () { // 管理員可用「網址?gas=...」一次帶入設定
  var q = new URLSearchParams(location.search), gas = q.get('gas');
  if (gas && !APP_CONFIG.GAS_URL) { cfg.GAS_URL = gas; ls(LS_CFG, JSON.stringify(cfg)); history.replaceState(null, '', location.pathname + location.hash); }
})();

var S = { token: ls(LS_TOKEN), boot: null, cases: [], view: 'todo', caseFilter: {}, reportTab: 'stats', logs: null, users: null, openCaseId: null, loadedAt: 0 };

/* ---------- 共用 ---------- */
function toast(msg, err) {
  var d = document.createElement('div'); if (err) d.className = 'err'; d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(function () { d.remove(); }, err ? 6000 : 3000);
}
var busyN = 0;
function busy(on) { busyN += on ? 1 : -1; $('#busy').classList.toggle('hidden', busyN <= 0); }

function api(action, payload) {
  busy(true);
  return fetch(cfg.GAS_URL, { method: 'POST', body: JSON.stringify({ action: action, payload: payload || {}, token: S.token }) })
    .then(function (r) { if (!r.ok) throw new Error('連線失敗（' + r.status + '）'); return r.json(); })
    .catch(function (e) {
      if (e instanceof TypeError) throw new Error('連不到後端。若一直發生，可能是防毒軟體或網路擋住 Google 服務');
      throw e;
    })
    .then(function (r) {
      if (!r.ok) {
        if (r.auth && action !== 'login') { logout(r.error); }
        if (r.mustChange) { showPwChange(); }
        var err = new Error(r.error); err.auth = r.auth; err.mustChange = r.mustChange; throw err;
      }
      return r.data;
    })
    .finally(function () { busy(false); });
}

function pad(n) { return (n < 10 ? '0' : '') + n; }
function nowLocal() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function today() { return nowLocal().slice(0, 10); }
function addDays(ymd, n) { var p = ymd.split('-'); var d = new Date(Date.UTC(+p[0], p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { var pa = a.split('-'), pb = b.split('-'); return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5); }
function zh(ymd) { if (!ymd) return ''; var p = ymd.slice(0, 10).split('-'); return p[0] + '年' + p[1] + '月' + p[2] + '日'; }
function short(dt) { return dt ? dt.slice(0, 16) : ''; }
function userLabel(rec) { return esc(rec.byName || rec.by) + (rec.byName ? ' <span style="color:var(--ink3)">(' + esc(rec.by) + ')</span>' : ''); }

function steps() { return S.boot.steps; }
/* 15天聯絡機制：從第1次聯絡（使用者簡訊日）起算，第7天第2次、第14天第3次、第15天轉ASS */
function contact() { return S.boot.contact || { group: '15天聯絡機制', total: 15, offset: { 3: 7, 4: 14, 5: 15 } }; }
function userSms(c, n) { var r = c.data['s' + n]; return r && r.values && r.values.targets && r.values.targets['使用者'] ? String(r.values.targets['使用者']).slice(0, 10) : ''; }
function contactAnchor(c) { return userSms(c, 3); }
function contactDue(anchor, stepNo, sentDay) { if (!anchor) return ''; var due = addDays(anchor, contact().offset[stepNo]); if (sentDay) { var mn = addDays(sentDay, 1); if (due < mn) due = mn; } return due; }
function contactDay(c) { var a = contactAnchor(c); if (!a) return 0; return daysBetween(a, today()) + 1; }
function stepTitle(d) { return d.group ? d.title.split('－').slice(1).join('－') : d.title; }
function unitName(u) { return S.boot.units[u] || u; }
function me() { return S.boot.me; }
function isAdmin() { return me().role === 'admin'; }
function canAct(unit) { return isAdmin() || me().unit === unit; }

/* 案件狀態計算 */
function info(c) {
  var t = today();
  var r = { stepDef: steps()[c.step] || null, waiting: false, waitLeft: 0, waited: 0, overdue: false, dueToday: false };
  if (c.status !== '進行中') return r;
  var avail = (c.availableAt || c.createdAt || '').slice(0, 10);
  if (avail > t) { r.waiting = true; r.waitLeft = daysBetween(t, avail); return r; }
  r.waited = daysBetween(avail, t);
  r.dueToday = !!c.dueAt && avail === t;
  r.overdue = r.waited >= +(S.boot.settings.OVERDUE_DAYS || 2);
  return r;
}

  if (i.overdue) return '<span class="chip c-bad">逾期 ' + i.waited + ' 天</span>';
  if (i.dueToday) return '<span class="chip c-warn">今天到期</span>';

}

      return '<tr><td style="white-space:nowrap">' + esc(l.ts) + '</td><td>' + esc(l.name) + '<div style="font-size:12px;color:var(--ink3)">' + esc(l.email) + '</div></td><td>' + esc(unitName(l.unit)) + '</td><td>' + esc(l.action) + '</td><td>' +
        (l.caseId ? '<a href="#case-' + esc(l.caseId) + '">' + esc(l.dispatchNo) + '</a>' : '') + '</td><td>' + esc(l.step ? (steps()[+l.step] || {}).short || l.step : '') + '</td><td style="max-width:380px;word-break:break-all">' + esc(l.detail) + '</td></tr>';
    }).join('') || '<tr><td colspan="7"><div class="empty">沒有紀錄</div></td></tr>';
  };
  var load = function () {
    f.from = $('#lFrom').value; f.to = $('#lTo').value;
    api('listLogs', { from: f.from, to: f.to }).then(function (logs) {
      S.logs = logs;
      var acts = {}; logs.forEach(function (l) { acts[l.action] = 1; });
      $('#lAct').innerHTML = '<option value="">全部動作</option>' + Object.keys(acts).map(function (a) { return '<option' + (f.act === a ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('');
      draw();
    }).catch(function (e) { toast(e.message, true); });
  };
  $('#lLoad').onclick = load; $('#lQ').oninput = draw; $('#lUnit').onchange = draw; $('#lAct').onchange = draw;
  if ($('#lExport')) $('#lExport').onclick = function () { saveXlsx([['操作紀錄', shown.map(function (l) { return { '時間': l.ts, '帳號': l.email, '姓名': l.name, '單位': unitName(l.unit), '動作': l.action, '派工編號': l.dispatchNo, '關卡': l.step ? (steps()[+l.step] || {}).title || l.step : '', '內容': l.detail }; })]], 'P單久置未取_操作紀錄_' + f.from + '_' + f.to + '.xlsx'); };
  load();
}

/* ---------- 管理設定 ---------- */
function vAdmin(el) {
  el.innerHTML = '<h2>管理設定</h2><div class="panel"><h3>帳號白名單</h3><div class="actions" style="margin-bottom:10px"><button class="btn pri" id="uAdd">＋ 新增帳號</button></div><div id="uList">載入中…</div></div>' +
    '<div class="panel"><h3>系統設定</h3><div id="setBox"></div></div><div class="panel"><h3>系統狀態</h3><div id="sysBox">載入中…</div></div>';
  var loadUsers = function () { api('listUsers').then(function (d) { S.users = d; drawUsers(); }).catch(function (e) { toast(e.message, true); }); };
  var drawUsers = function () {
    var d = S.users;
    $('#uList').innerHTML = '<div class="tbl-wrap"><table class="t"><tr><th>登入帳號</th><th>姓名</th><th>通知信 Email</th><th>角色</th><th>單位</th><th>聯強區域</th><th>狀態</th><th>最後登入</th><th></th></tr>' +
      d.users.map(function (u) { return '<tr><td style="word-break:break-all">' + esc(u.email) + '</td><td>' + esc(u.name) + '</td><td>' + esc(u.notifyEmail || '') + '</td><td>' + (u.role === 'admin' ? '<span class="chip c-warn">管理員</span>' : '使用者') + '</td><td>' + esc(unitName(u.unit)) + '</td><td>' + esc((u.regions || '').split(',').join('、')) + '</td><td>' + (u.active === 'Y' ? '<span class="chip c-done">啟用</span>' : '<span class="chip c-stop">停用</span>') + (u.mustChange === 'Y' ? ' <span class="chip c-wait">待改密碼</span>' : '') + (u.locked ? ' <span class="chip c-bad">鎖定中</span>' : '') + '</td><td>' + esc(short(u.lastLoginAt)) + '</td><td><button class="btn sm" data-eu="' + esc(u.email) + '">編輯</button></td></tr>'; }).join('') + '</table></div>';
    $$('[data-eu]').forEach(function (b) { b.onclick = function () { userForm(d.users.filter(function (u) { return u.email === b.dataset.eu; })[0]); }; });
  };
  var userForm = function (u) {
    u = u || { email: '', name: '', role: 'user', unit: '', active: 'Y', isNew: true };
    modal('<h3>' + (u.isNew ? '新增帳號' : '編輯帳號') + '</h3>' +
      '<div class="form-row"><label>登入帳號（Email） <span class="req">*</span></label><input id="uE" value="' + esc(u.email) + '"' + (u.isNew ? '' : ' disabled') + '></div>' +
      '<div class="grid2"><div class="form-row"><label>姓名</label><input id="uN" value="' + esc(u.name) + '"></div>' +
      '<div class="form-row"><label>通知信 Email（空白＝寄到登入帳號）</label><input id="uM" type="email" value="' + esc(u.notifyEmail || '') + '" placeholder="name@example.com"></div></div>' +
      '<div class="grid2"><div class="form-row"><label>單位 <span class="req">*</span></label><select id="uU"><option value="">請選擇</option>' + Object.keys(S.boot.units).map(function (k) { return '<option value="' + k + '"' + (u.unit === k ? ' selected' : '') + '>' + unitName(k) + '</option>'; }).join('') + '</select></div>' +
      '<div class="form-row"><label>角色</label><select id="uR"><option value="user"' + (u.role === 'user' ? ' selected' : '') + '>使用者</option><option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>管理員</option></select></div></div>' +
      '<div class="form-row" id="uRegRow"><label>聯強區域 <span class="req">*</span>（勾多區＝跨區；全區可看三區）</label><div style="display:flex;gap:14px;flex-wrap:wrap">' +
        S.boot.regions.concat([S.boot.allRegion]).map(function (r) { var cur = String(u.regions || '').split(','); return '<label style="font-weight:400;display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--ink)"><input type="checkbox" class="uRg" value="' + r + '"' + (cur.indexOf(r) >= 0 ? ' checked' : '') + '> ' + r + '</label>'; }).join('') + '</div></div>' +
      '<div class="form-row"><label>' + (u.isNew ? '初始密碼 <span class="req">*</span>' : '重設密碼（空白＝不變更）') + '（至少 8 個字，要有英文字母和數字；使用者第一次登入會被要求改掉）</label><div style="display:flex;gap:8px"><input id="uP" type="text" autocomplete="off" style="flex:1"><button class="btn" type="button" id="uGen">產生</button></div></div>' +
      (u.locked ? '<div class="form-row"><label><input type="checkbox" id="uUnlock" checked> 解除鎖定（密碼錯誤太多次）</label></div>' : '') +
      '<div class="form-row"><label>狀態</label><select id="uA"><option value="Y"' + (u.active === 'Y' ? ' selected' : '') + '>啟用</option><option value="N"' + (u.active === 'N' ? ' selected' : '') + '>停用</option></select></div>' +
      '<div class="notice info">同單位的所有啟用帳號都會收到該單位的通知信；聯強帳號只收自己區域的建立、結案與中止通知。密碼請用電話或當面告訴同事。</div><div class="actions"><button class="btn" data-close>取消</button><button class="btn pri" id="uOk">儲存</button></div>', function (m, close) {
      var syncReg = function () { $('#uRegRow', m).style.display = $('#uU', m).value === '聯強' ? '' : 'none'; };
      $('#uU', m).onchange = syncReg; syncReg();
      $$('.uRg', m).forEach(function (cb) { cb.onchange = function () { if (cb.value === S.boot.allRegion && cb.checked) $$('.uRg', m).forEach(function (o) { if (o !== cb) o.checked = false; }); else if (cb.checked) $$('.uRg', m).forEach(function (o) { if (o.value === S.boot.allRegion) o.checked = false; }); }; });
      $('#uGen', m).onclick = function () { var a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ', n = '23456789', out = '', r = new Uint32Array(10); crypto.getRandomValues(r); for (var i = 0; i < 7; i++) out += a[r[i] % a.length]; for (; i < 10; i++) out += n[r[i] % n.length]; $('#uP', m).value = out; };
      $('#uOk', m).onclick = function () {
        var regs = $$('.uRg', m).filter(function (cb) { return cb.checked; }).map(function (cb) { return cb.value; });
        var pw = $('#uP', m).value.trim();
        api('saveUser', { email: $('#uE', m).value, name: $('#uN', m).value.trim(), notifyEmail: $('#uM', m).value.trim(), unit: $('#uU', m).value, role: $('#uR', m).value, active: $('#uA', m).value, regions: $('#uU', m).value === '聯強' ? regs : [], password: pw, unlock: !!($('#uUnlock', m) && $('#uUnlock', m).checked) })
          .then(function (d) { S.users = d; drawUsers(); close(); toast(pw ? '已儲存，請把密碼告訴同事：' + pw : '已儲存'); }).catch(function (e) { toast(e.message, true); });
      };
    });
  };
  $('#uAdd').onclick = function () { userForm(); };
  var s = S.boot.settings;
  var tpls = [['tpl_user_1', '15天聯絡機制 第1次聯絡・給使用者'], ['tpl_user_2', '15天聯絡機制 第2次聯絡・給使用者'], ['tpl_plat_2', '15天聯絡機制 第2次聯絡・給上手白金'], ['tpl_user_3', '15天聯絡機制 第3次聯絡・給使用者'], ['tpl_plat_3', '15天聯絡機制 第3次聯絡・給上手白金']];
  $('#setBox').innerHTML = '<div class="grid2"><div class="form-row"><label>平台網址（信件中的連結）</label><input id="sURL" value="' + esc(s.APP_URL || location.href.split('#')[0]) + '"></div>' +
    '<div class="form-row"><label>15 天聯絡機制</label><div class="notice info" style="margin:0">從第1次聯絡（使用者簡訊日）起算：第7天第2次、第14天第3次、第15天轉 ASS</div></div>' +
    '<div class="form-row"><label>超過幾天沒處理算逾期</label><input id="sOD" type="number" min="1" value="' + esc(s.OVERDUE_DAYS) + '"></div>' +
    '<div class="form-row"><label>每日提醒信寄送時間（0~23 點）</label><input id="sHR" type="number" min="0" max="23" value="' + esc(s.REMIND_HOUR) + '"></div></div>' +
    '<h3 style="margin-top:8px">簡訊範本</h3><p style="font-size:13px;color:var(--ink2);margin-top:0">可用代碼：{派工編號} {訂單編號} {訂購日期} {聯強反映日} {前次簡訊日} {簡訊日} {期限}（第1次＝第7天、第2次＝第14天、第3次＝第15天，從第1次聯絡日起算）</p>' +
    tpls.map(function (t) { return '<div class="form-row"><label>' + t[1] + '</label><textarea data-tpl="' + t[0] + '" style="min-height:110px">' + esc(s[t[0]] || '') + '</textarea></div>'; }).join('') +
    '<button class="btn pri" id="sSave">儲存設定</button>';
  $('#sSave').onclick = function () {
    var p = { APP_URL: $('#sURL').value.trim(), OVERDUE_DAYS: $('#sOD').value, REMIND_HOUR: $('#sHR').value };
    $$('[data-tpl]').forEach(function (t) { p[t.dataset.tpl] = t.value; });
    api('saveSettings', p).then(function (ns) { S.boot.settings = ns; ls(LS_BOOT, JSON.stringify(S.boot)); toast('設定已儲存'); }).catch(function (e) { toast(e.message, true); });
  };
  api('adminInfo').then(function (d) {
    $('#sysBox').innerHTML = (d.mailNote ? '<p>' + esc(d.mailNote) + '</p>' : '<p>今日剩餘發信額度：<b>' + d.quota + '</b> 封（個人 Gmail 每天約 100 封）</p>') + (d.sheetUrl && d.sheetUrl !== '#' ? '<p><a href="' + esc(d.sheetUrl) + '" target="_blank" rel="noopener">開啟資料庫試算表</a>（請勿手動改欄位名稱）</p>' : '') +
      '<button class="btn" id="runDaily">立即寄出今日提醒信</button>';
    $('#runDaily').onclick = function () { api('runDaily').then(function (r) { toast('已執行：寄給 ' + (r.sent.join('、') || '無') + '，逾期 ' + r.overdue + ' 件'); }).catch(function (e) { toast(e.message, true); }); };
  }).catch(function (e) { $('#sysBox').textContent = e.message; });
  loadUsers();
}

window.__toast = toast;
start();
})();
</script>
